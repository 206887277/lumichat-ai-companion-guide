<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AI companion memory control benchmark</title>
  <desc id="desc">Five benchmark dimensions—durable recall, correction precedence, scope isolation, expiry and forgetting, and provenance and uncertainty—each contain four tests.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071321"/><stop offset="1" stop-color="#172847"/></linearGradient><linearGradient id="a" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#5bdcc8"/><stop offset=".5" stop-color="#828cff"/><stop offset="1" stop-color="#ffb86d"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000" flood-opacity=".3"/></filter></defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="92" y="105" fill="#f4f7ff" font-family="Inter,Arial,sans-serif" font-size="51" font-weight="760">AI Companion Memory Control Benchmark</text>
  <text x="92" y="156" fill="#aebbd2" font-family="Inter,Arial,sans-serif" font-size="24">20 reproducible tests across five behaviors that a recall demo cannot measure.</text>
  <g filter="url(#s)" font-family="Inter,Arial,sans-serif">
    <g transform="translate(90 240)"><rect width="270" height="390" rx="26" fill="#10243c" stroke="#5bdcc8" stroke-width="3"/><circle cx="135" cy="72" r="42" fill="#5bdcc8"/><text x="135" y="84" text-anchor="middle" fill="#071321" font-size="33" font-weight="850">A</text><text x="135" y="150" text-anchor="middle" fill="#f4f7ff" font-size="27" font-weight="750">Durable recall</text><text x="35" y="211" fill="#c9d6e7" font-size="20">A1  explicit fact</text><text x="35" y="254" fill="#c9d6e7" font-size="20">A2  restart</text><text x="35" y="297" fill="#c9d6e7" font-size="20">A3  paraphrase</text><text x="35" y="340" fill="#c9d6e7" font-size="20">A4  no invention</text></g>
    <g transform="translate(378 240)"><rect width="270" height="390" rx="26" fill="#12243e" stroke="#70cbd7" stroke-width="3"/><circle cx="135" cy="72" r="42" fill="#70cbd7"/><text x="135" y="84" text-anchor="middle" fill="#071321" font-size="33" font-weight="850">B</text><text x="135" y="150" text-anchor="middle" fill="#f4f7ff" font-size="27" font-weight="750">Corrections</text><text x="35" y="211" fill="#c9d6e7" font-size="20">B1  direct update</text><text x="35" y="254" fill="#c9d6e7" font-size="20">B2  old excluded</text><text x="35" y="297" fill="#c9d6e7" font-size="20">B3  chain</text><text x="35" y="340" fill="#c9d6e7" font-size="20">B4  distraction</text></g>
    <g transform="translate(666 240)"><rect width="270" height="390" rx="26" fill="#162340" stroke="#828cff" stroke-width="3"/><circle cx="135" cy="72" r="42" fill="#828cff"/><text x="135" y="84" text-anchor="middle" fill="#071321" font-size="33" font-weight="850">C</text><text x="135" y="150" text-anchor="middle" fill="#f4f7ff" font-size="27" font-weight="750">Scope isolation</text><text x="35" y="211" fill="#c9d6e7" font-size="20">C1  character</text><text x="35" y="254" fill="#c9d6e7" font-size="20">C2  conversation</text><text x="35" y="297" fill="#c9d6e7" font-size="20">C3  scene</text><text x="35" y="340" fill="#c9d6e7" font-size="20">C4  role identity</text></g>
    <g transform="translate(954 240)"><rect width="270" height="390" rx="26" fill="#1d213e" stroke="#c08bd2" stroke-width="3"/><circle cx="135" cy="72" r="42" fill="#c08bd2"/><text x="135" y="84" text-anchor="middle" fill="#071321" font-size="33" font-weight="850">D</text><text x="135" y="150" text-anchor="middle" fill="#f4f7ff" font-size="27" font-weight="750">Expiry + forget</text><text x="35" y="211" fill="#c9d6e7" font-size="20">D1  time limit</text><text x="35" y="254" fill="#c9d6e7" font-size="20">D2  event end</text><text x="35" y="297" fill="#c9d6e7" font-size="20">D3  forget</text><text x="35" y="340" fill="#c9d6e7" font-size="20">D4  no resurrection</text></g>
    <g transform="translate(1242 240)"><rect width="270" height="390" rx="26" fill="#242038" stroke="#ffb86d" stroke-width="3"/><circle cx="135" cy="72" r="42" fill="#ffb86d"/><text x="135" y="84" text-anchor="middle" fill="#071321" font-size="33" font-weight="850">E</text><text x="135" y="150" text-anchor="middle" fill="#f4f7ff" font-size="25" font-weight="750">Evidence + doubt</text><text x="35" y="211" fill="#c9d6e7" font-size="20">E1  not completed</text><text x="35" y="254" fill="#c9d6e7" font-size="20">E2  weak inference</text><text x="35" y="297" fill="#c9d6e7" font-size="20">E3  conflict</text><text x="35" y="340" fill="#c9d6e7" font-size="20">E4  visibility</text></g>
  </g>
  <rect x="290" y="708" width="1020" height="100" rx="50" fill="url(#a)"/>
  <text x="800" y="752" text-anchor="middle" fill="#071321" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="800">SCORE EACH TEST 0–2 • RECORD CONFIDENCE • KEEP EXACT EVIDENCE</text>
  <text x="800" y="784" text-anchor="middle" fill="#071321" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700">The total is a diagnostic profile—not a universal product ranking.</text>
</svg>
